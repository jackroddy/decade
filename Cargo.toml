[workspace]
resolver = "3"
members = ["decade-channel"]

[profile.dev]
opt-level = 1

[package]
name = "decade"
version = "0.1.0"
description = "dynamic extensible collaborative agent development environment"
readme = "README.md"
exclude = ["CLAUDE.md", ".claude", "tmp-claude"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Jack Roddy <jack.w.roddy@gmail.com>"]
repository = "https://github.com/jackroddy/decade"

[dependencies]
fontdb = "0.24.0"
rustix = { version = "0.38", features = ["event", "fs", "net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
swash = "0.2.10"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
decade-channel = { path = "decade-channel", version = "0.1.0" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
calloop = { version = "0.14", features = ["signals"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-streamable-http-server"] }
smithay = { version = "0.7", default-features = false, features = ["backend_egl", "backend_gbm", "renderer_gl", "wayland_frontend", "desktop"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "rt"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

[dev-dependencies]
rmcp = { version = "3", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
