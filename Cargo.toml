[workspace]
resolver = "3"
members = ["decade-channel"]

[package]
name = "decade"
version = "0.1.0"
description = "dynamic extensible collaborative agent development environment"
readme = "README.md"
exclude = ["CLAUDE.md", ".claude", "tmp-claude"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Jack Roddy <jack.w.roddy@gmail.com>"]
repository = "https://github.com/jackroddy/decade"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
fontdb = "0.24.0"
rmcp = { version = "3", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_egl", "renderer_gl", "wayland_frontend", "desktop"] }
swash = "0.2.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "rt"] }

[dev-dependencies]
rmcp = { version = "3", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
