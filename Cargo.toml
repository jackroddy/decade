[package]
name = "decade"
version = "0.1.0"
description = "dynamic extensible collaborative agent development environment"
readme = "README.md"
exclude = ["CLAUDE.md", ".claude", "tmp-claude"]
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["Jack Roddy <jack.w.roddy@gmail.com>"]
repository = "https://github.com/jackroddy/decade"

[dependencies]
fontdb = "0.24.0"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_egl", "renderer_gl", "wayland_frontend", "desktop"] }
swash = "0.2.10"
