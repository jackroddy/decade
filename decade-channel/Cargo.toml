[package]
name = "decade-channel"
version = "0.1.0"
description = "client side of the decade socket, for decade-aware programs"
readme = "README.md"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["Jack Roddy <jack.w.roddy@gmail.com>"]
repository = "https://github.com/jackroddy/decade"
keywords = ["decade", "socket", "pane"]
categories = ["command-line-interface"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
